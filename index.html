<style>

<script>
// ── アニメ調の木漏れ日：背景の絵（CSS）の上で、光の筋・光の粒・舞う若葉・きらめきを動かす ──
// 部品は最初に1回だけ描いておき、毎コマは貼るだけにする（毎コマのぼかしはしない）
// 動きは「1秒に何ピクセル」で決める（コマが落ちても速さが変わらない）
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1, sunX = 0, sunY = 0;
let rays = [], motes = [], leaves = [], sparkles = [];

// 背景の絵の大きさ・CSSの表示位置・絵の中の太陽の位置（割合）。光の筋を絵の太陽から出すために使う
const ART = {
  pc: { iw: 1536, ih: 1024, px: 0.5, py: 0.15, sx: 0.116, sy: 0.068 },
  sp: { iw: 1024, ih: 1536, px: 0.3, py: 0,    sx: 0.15,  sy: 0.005 }
};
const portrait = window.matchMedia ? matchMedia('(orientation: portrait)') : null;
function placeSun(){
  const a = portrait && portrait.matches ? ART.sp : ART.pc;
  const k = Math.max(W / a.iw, H / a.ih);              // background-size: cover と同じ計算
  const dw = a.iw * k, dh = a.ih * k;
  sunX = (W - dw) * a.px + dw * a.sx;
  sunY = (H - dh) * a.py + dh * a.sy;
}

function rand(a, b){ return a + Math.random() * (b - a); }
function sprite(w, h, draw){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}

// 若葉（2色塗り＋縁の線＋葉脈の光）
const LEAF_COLORS = [
  ['#86c64e', '#5f9f37', '#c8ec8c', '#3f7a2a'],
  ['#a2d65c', '#78b23f', '#def6a6', '#4f8a2e'],
  ['#64b04c', '#448c36', '#acdf82', '#2f6b26'],
  ['#bfe070', '#93bf48', '#eefab4', '#5f8f2f']
];
function leafPath(c, w, h){
  c.beginPath();
  c.moveTo(6, h/2);
  c.bezierCurveTo(w*0.3, 3, w*0.72, 4, w-4, h/2);
  c.bezierCurveTo(w*0.72, h-4, w*0.3, h-3, 6, h/2);
  c.closePath();
}
const leafSprites = LEAF_COLORS.map(([base, shade, hi, line]) => sprite(120, 60, (c, w, h) => {
  leafPath(c, w, h); c.fillStyle = base; c.fill();
  c.save(); leafPath(c, w, h); c.clip();
  c.fillStyle = shade;
  c.beginPath(); c.moveTo(0, h/2); c.bezierCurveTo(w*0.35, h*0.6, w*0.7, h*0.58, w, h/2);
  c.lineTo(w, h); c.lineTo(0, h); c.closePath(); c.fill();
  c.globalAlpha = 0.6; c.fillStyle = hi;
  c.beginPath(); c.ellipse(w*0.4, h*0.3, w*0.2, h*0.09, -0.12, 0, Math.PI*2); c.fill();
  c.restore();
  leafPath(c, w, h); c.strokeStyle = line; c.lineWidth = 2.4; c.stroke();
  c.strokeStyle = hi; c.lineWidth = 1.8;
  c.beginPath(); c.moveTo(8, h/2); c.quadraticCurveTo(w*0.5, h*0.47, w-10, h/2); c.stroke();
  c.strokeStyle = line; c.lineWidth = 3;
  c.beginPath(); c.moveTo(0, h/2+1); c.lineTo(9, h/2); c.stroke();
}));

// きらめき（十字の星＋光のにじみ）
const sparkleSprite = sprite(96, 96, (c, w) => {
  const m = w/2;
  const g = c.createRadialGradient(m, m, 0, m, m, m);
  g.addColorStop(0, 'rgba(255,255,236,0.95)');
  g.addColorStop(0.22, 'rgba(255,252,214,0.4)');
  g.addColorStop(1, 'rgba(255,252,214,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, w);
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.moveTo(m, 2);
  c.quadraticCurveTo(m+3, m-3, w-2, m);
  c.quadraticCurveTo(m+3, m+3, m, w-2);
  c.quadraticCurveTo(m-3, m+3, 2, m);
  c.quadraticCurveTo(m-3, m-3, m, 2);
  c.fill();
});

// 光の粒（縁の明るい玉ボケ）
const moteSprite = sprite(128, 128, (c, w) => {
  const m = w/2, r = m - 4;
  const g = c.createRadialGradient(m, m, 0, m, m, r);
  g.addColorStop(0, 'rgba(255,255,238,0.28)');
  g.addColorStop(0.85, 'rgba(255,255,230,0.2)');
  g.addColorStop(1, 'rgba(255,255,230,0.05)');
  c.fillStyle = g; c.beginPath(); c.arc(m, m, r, 0, Math.PI*2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2.5;
  c.beginPath(); c.arc(m, m, r-1, 0, Math.PI*2); c.stroke();
});

// 光の筋（中心が明るく、先へ行くほど消える帯）
const raySprite = sprite(128, 512, (c, w, h) => {
  const across = c.createLinearGradient(0, 0, w, 0);
  across.addColorStop(0, 'rgba(255,249,214,0)');
  across.addColorStop(0.5, 'rgba(255,249,214,1)');
  across.addColorStop(1, 'rgba(255,249,214,0)');
  c.fillStyle = across; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'destination-in';
  const along = c.createLinearGradient(0, 0, 0, h);
  along.addColorStop(0, 'rgba(0,0,0,1)');
  along.addColorStop(0.55, 'rgba(0,0,0,0.5)');
  along.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = along; c.fillRect(0, 0, w, h);
});

function newLeaf(top){
  const depth = Math.random();                       // 0＝奥 1＝手前
  return {
    x: rand(-40, W+40), y: top ? rand(-H*0.3, -30) : rand(-30, H),
    s: 22 + depth*44, a: 0.55 + depth*0.43,
    vy: 16 + depth*30, vx: rand(4, 14),
    sway: rand(18, 54), swF: rand(0.35, 0.8), ph: rand(0, Math.PI*2),
    rot: rand(0, Math.PI*2), vr: rand(-0.6, 0.6),
    flip: rand(1.1, 2.6), img: leafSprites[Math.floor(Math.random()*leafSprites.length)], depth
  };
}
function placeSparkle(p){
  // 半分は太陽のまわり、残りは画面の上半分に散らす
  if(Math.random() < 0.5){
    const r = Math.min(W, H) * 0.45 * Math.pow(Math.random(), 0.8), th = rand(0, Math.PI*2);
    p.x = sunX + Math.cos(th)*r; p.y = Math.max(0, sunY + Math.sin(th)*r);
  } else {
    p.x = rand(0, W); p.y = H * 0.6 * Math.random();
  }
  p.s = rand(10, 26); p.T = rand(2.4, 5); p.age = 0; p.spin = rand(-0.4, 0.4);
  return p;
}
function build(){
  rays = Array.from({length: 6}, (_, i) => ({
    ang: 0.25 + i*0.19 + rand(-0.03, 0.03), w: rand(110, 280),
    a: rand(0.12, 0.24), ph: rand(0, Math.PI*2), sp: rand(0.18, 0.4)
  }));
  motes = Array.from({length: Math.round(W*H/110000) + 6}, () => ({
    x: rand(0, W), y: rand(0, H), r: rand(10, 34), vy: rand(-12, -4), vx: rand(-4, 4),
    a: rand(0.35, 0.8), ph: rand(0, Math.PI*2)
  }));
  leaves = Array.from({length: Math.round(W*H/90000) + 6}, () => newLeaf(false)).sort((p, q) => p.depth - q.depth);
  sparkles = Array.from({length: Math.round(W*H/80000) + 8}, () => {
    const p = placeSparkle({}); p.age = rand(0, p.T); return p;
  });
}

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  // スマホのアドレスバーの出入り（高さだけ少し変わる）では作り直さない
  const rebuild = !leaves.length || Math.abs(w - W) > 1 || Math.abs(h - H) > 140;
  W = w; H = h;
  placeSun();
  if(rebuild) build();
  if(still) draw(0, 0);
}
window.addEventListener('resize', resize);

function draw(t, dt){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 光の筋（絵の太陽から差し込む・ゆっくり明滅）
  const L = Math.hypot(W, H) * 1.15;
  rays.forEach(r => {
    const a = r.a * (0.55 + 0.45*Math.sin(t*r.sp + r.ph));
    const ang = r.ang + Math.sin(t*0.07 + r.ph)*0.015;
    ctx.save();
    ctx.translate(sunX, sunY);
    ctx.rotate(-ang);
    ctx.globalAlpha = a;
    ctx.drawImage(raySprite, -r.w/2, 0, r.w, L);
    ctx.restore();
  });

  // 光の粒（ゆっくり昇る）
  motes.forEach(m => {
    m.x += m.vx*dt; m.y += m.vy*dt;
    if(m.y < -m.r*2){ m.y = H + m.r*2; m.x = rand(0, W); }
    if(m.x < -m.r*2) m.x = W + m.r*2; if(m.x > W + m.r*2) m.x = -m.r*2;
    ctx.globalAlpha = m.a * (0.6 + 0.4*Math.sin(t*0.9 + m.ph));
    ctx.drawImage(moteSprite, m.x - m.r, m.y - m.r, m.r*2, m.r*2);
  });

  // 舞う若葉（奥から手前の順・くるりと裏返りながら落ちる）
  leaves.forEach((l, i) => {
    l.y += l.vy*dt; l.x += l.vx*dt; l.rot += l.vr*dt;
    if(l.y > H + 60 || l.x > W + 80){ leaves[i] = Object.assign(newLeaf(true), {depth: l.depth, s: l.s, a: l.a, vy: l.vy}); return; }
    const x = l.x + Math.sin(t*l.swF + l.ph)*l.sway;
    const ang = l.rot + Math.sin(t*l.swF*1.3 + l.ph)*0.6;
    const flip = Math.cos(t*l.flip + l.ph);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.translate(x, l.y);
    ctx.rotate(ang);
    ctx.scale(1, Math.abs(flip) < 0.12 ? 0.12*Math.sign(flip || 1) : flip);
    ctx.globalAlpha = l.a;
    ctx.drawImage(l.img, -l.s/2, -l.s/4, l.s, l.s/2);
  });
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // きらめき（ふっと光って消え、別の場所でまた光る）
  sparkles.forEach(p => {
    p.age += dt;
    if(p.age > p.T) placeSparkle(p);
    const k = Math.sin(Math.PI * p.age / p.T);
    const v = k*k*k;
    if(v < 0.02) return;
    const s = p.s * (0.55 + 0.45*v);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.spin * p.age);
    ctx.globalAlpha = v;
    ctx.drawImage(sparkleSprite, -s, -s, s*2, s*2);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

let last = 0;
function animate(ts){
  const t = ts * 0.001;
  const dt = last ? Math.min(0.05, t - last) : 0;   // 長く止まった後に一気に進まないよう上限
  last = t;
  draw(t, dt);
  requestAnimationFrame(animate);
}

resize();
if(!still) requestAnimationFrame(animate);
</script>
</body>
</html>
